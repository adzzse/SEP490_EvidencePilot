services:
  db:
    image: mysql:8.0.46
    container_name: evidence_pilot_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data_refactor:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_ROOT_PASSWORD} --silent" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - evidence-network

  vector-db:
    image: qdrant/qdrant:v1.19.0
    container_name: evidence_pilot_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT_HOST:-6333}:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      evidence-network:
        aliases:
          - qdrant

  minio:
    image: minio/minio:latest
    container_name: evidence_pilot_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - evidence-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: evidence_pilot_rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VIRTUAL_HOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - evidence-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - MAVEN_SKIP_TESTS=true
    container_name: evidence_pilot_be
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT_HOST:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      vector-db:
        condition: service_started
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # ── Database (internal Docker network — use service name, NOT host port) ──
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

      # ── Qdrant (internal Docker network) ─────────────────────────────────────
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}

      # ── MinIO ────────────────────────────────────────────────────────────────
      MINIO_URL: ${MINIO_URL}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-${MINIO_URL}}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}

      # ── RabbitMQ ─────────────────────────────────────────────────────────────
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VIRTUAL_HOST}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # Listener QoS — must be forwarded explicitly; --env-file alone only
      # feeds compose interpolation, never the container environment.
      RABBITMQ_LISTENER_CONCURRENCY: ${RABBITMQ_LISTENER_CONCURRENCY:-2}
      RABBITMQ_LISTENER_PREFETCH: ${RABBITMQ_LISTENER_PREFETCH:-2}
      RABBITMQ_EXTRACTION_MAX_CONCURRENCY: ${RABBITMQ_EXTRACTION_MAX_CONCURRENCY:-3}

      # ── AI Model (from .env) ─────────────────────────────────────────────────
      AI_MODEL_BASE_URL: ${AI_MODEL_BASE_URL}
      AI_MODEL_API_KEY: ${AI_MODEL_API_KEY:-}
      AI_MODEL_READ_TIMEOUT_SECONDS: ${AI_MODEL_READ_TIMEOUT_SECONDS}
      AI_MODEL_MAX_RETRIES: ${AI_MODEL_MAX_RETRIES:-3}
      AI_MODEL_MAX_CONCURRENT_REQUESTS: ${AI_MODEL_MAX_CONCURRENT_REQUESTS:-3}
      AI_MODEL_MIN_INTERVAL_MS: ${AI_MODEL_MIN_INTERVAL_MS:-4000}

      # ── Seed accounts (from .env) ──────────────────────────────────────────
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Admin}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-User}
      STUDENT_EMAIL: ${STUDENT_EMAIL}
      STUDENT_PASSWORD: ${STUDENT_PASSWORD}
      STUDENT_FIRST_NAME: ${STUDENT_FIRST_NAME:-Test}
      STUDENT_LAST_NAME: ${STUDENT_LAST_NAME:-Student}
      STUDENT_CODE: ${STUDENT_CODE:-}
      INSTRUCTOR_EMAIL: ${INSTRUCTOR_EMAIL}
      INSTRUCTOR_PASSWORD: ${INSTRUCTOR_PASSWORD}
      INSTRUCTOR_FIRST_NAME: ${INSTRUCTOR_FIRST_NAME:-Test}
      INSTRUCTOR_LAST_NAME: ${INSTRUCTOR_LAST_NAME:-Instructor}

      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-}
      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-60}
      PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS: ${PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS:-60}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}

      # ── Set-password invitation link (required for user creation/import) ───
      APP_INVITATION_URL: ${APP_INVITATION_URL:-}
      APP_INVITATION_TTL_HOURS: ${APP_INVITATION_TTL_HOURS:-24}
      # Silent seed requires explicit dev/test plus this flag; production wins.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      APP_ENV: ${APP_ENV:-}
      APP_DEV_BYPASS_ENABLED: ${APP_DEV_BYPASS_ENABLED:-false}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}

      # ── Application base URL (public-facing, e.g. ngrok) ──────────────────
      APP_BASE_URL: ${APP_BASE_URL}

      # ── Upload caps (seed bundles can be hundreds of MB) ────────────────────
      UPLOAD_MAX_FILE_SIZE: ${UPLOAD_MAX_FILE_SIZE:-256MB}
      UPLOAD_MAX_REQUEST_SIZE: ${UPLOAD_MAX_REQUEST_SIZE:-256MB}
      SEED_MAX_UPLOAD_BYTES: ${SEED_MAX_UPLOAD_BYTES:-268435456}
      SEED_MAX_EXPANDED_BYTES: ${SEED_MAX_EXPANDED_BYTES:-536870912}
      SEED_MAX_ENTRIES: ${SEED_MAX_ENTRIES:-2000}

      SERVER_PORT: 8080
    networks:
      - evidence-network

networks:
  evidence-network:
    driver: bridge

volumes:
  db_data_refactor:
  qdrant_data:
  minio_data:
  rabbitmq_data:
