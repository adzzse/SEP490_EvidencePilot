spring:
  # ── Disable Spring Security auto-config (we only use spring-security-crypto
  #    for BCrypt – no filter chain, no login page, no sessions) ─────────────
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 0

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        # Enable Hibernate 6 native JSON mapping (used by Graph.graphData)
        type:
          json_format_mapper: jackson

  # ── Spring Boot SQL initializer ───────────────────────────────────────────
  sql:
    init:
      mode: never

  # ── File upload limits ────────────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 52MB

  # ── RabbitMQ configuration ────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    management-url: ${RABBITMQ_MANAGEMENT_URL:}
    listener:
      simple:
        prefetch: ${RABBITMQ_LISTENER_PREFETCH:1}
        concurrency: ${RABBITMQ_LISTENER_CONCURRENCY:1}
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 5s
          multiplier: 2
          max-attempts: 3
          max-interval: 30s

  # ── SMTP mail configuration (used for password reset) ─────────────────────
  # IMPORTANT: MAIL_PASSWORD must be an App Password, NOT your primary account
  # password. For Gmail, generate one at https://myaccount.google.com/apppasswords.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# ── Application-level settings ────────────────────────────────────────────
app:
  base-url: ${APP_BASE_URL}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    first-name: ${ADMIN_FIRST_NAME:Admin}
    last-name: ${ADMIN_LAST_NAME:User}
  student:
    email: ${STUDENT_EMAIL:}
    password: ${STUDENT_PASSWORD:}
    first-name: ${STUDENT_FIRST_NAME:Test}
    last-name: ${STUDENT_LAST_NAME:Student}
    student-code: ${STUDENT_CODE:}
  instructor:
    email: ${INSTRUCTOR_EMAIL:}
    password: ${INSTRUCTOR_PASSWORD:}
    first-name: ${INSTRUCTOR_FIRST_NAME:Test}
    last-name: ${INSTRUCTOR_LAST_NAME:Instructor}
  password-reset:
    url: ${PASSWORD_RESET_URL:}
    token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:60}
    request-cooldown-seconds: ${PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS:60}
  invitation:
    url: ${APP_INVITATION_URL:}
    ttl-hours: ${APP_INVITATION_TTL_HOURS:24}
  # Dev-only user-creation bypass (fixed password, no email). The bypass code
  # path is additionally gated behind the dev Spring profile — this flag alone
  # can never enable it in production.
  dev-bypass:
    enabled: ${APP_DEV_BYPASS_ENABLED:false}

# ── External AI model integration ────────────────────────────────────────
ai:
  model:
    base-url: ${AI_MODEL_BASE_URL}
    # Optional API key forwarded as X-API-Key header.
    api-key: ${AI_MODEL_API_KEY:}
    # MinerU extraction can run for several minutes on large PDFs.
    read-timeout-seconds: ${AI_MODEL_READ_TIMEOUT_SECONDS:660}
    # Shared maximum across backend instances; each JVM also keeps local backpressure.
    max-concurrent-requests: ${AI_MODEL_MAX_CONCURRENT_REQUESTS:4}
    # Expired leases recover capacity after a backend crashes mid-call.
    lease-timeout-ms: ${AI_MODEL_LEASE_TIMEOUT_MS:3600000}
    # Database-backed minimum spacing shared by all backend instances.
    min-interval-ms: ${AI_MODEL_MIN_INTERVAL_MS:4000}
    # Retry transient AI failures (429/502/503/504) with backoff; 429 backs off at least 60s.
    max-retries: ${AI_MODEL_MAX_RETRIES:3}
  job:
    # Sweeper cadence and stuck-job TTL (see JobSweeper).
    sweep-interval-ms: ${AI_JOB_SWEEP_INTERVAL_MS:60000}
    processing-ttl-seconds: ${AI_JOB_PROCESSING_TTL_SECONDS:1800}

# ── Qdrant vector database ────────────────────────────────────────────────
qdrant:
  url: ${QDRANT_URL}
  api-key: ${QDRANT_API_KEY:}

# ── OpenAlex API ─────────────────────────────────────────────────────────
openalex:
  api-base-url: ${OPENALEX_API_BASE_URL:https://api.openalex.org}
  api-key: ${OPENALEX_API_KEY:}
  user-agent: ${OPENALEX_USER_AGENT:evidence-pilot/1.0 (mailto:team@evidencepilot.com)}
  read-timeout-seconds: ${OPENALEX_READ_TIMEOUT_SECONDS:30}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ── MinIO configuration ─────────────────────────────────────────────────────
minio:
  url: ${MINIO_URL}
  public-url: ${MINIO_PUBLIC_URL:${MINIO_URL}}
  region: ${MINIO_REGION:us-east-1}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME}
